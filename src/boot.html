<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Drooly</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0a0a0f;
    overflow: hidden;
    font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-user-select: none; user-select: none;
    cursor: default;
  }
  #stage {
    position: relative;
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background:
      radial-gradient(1200px 800px at 72% 18%, rgba(255,220,120,0.16), transparent 60%),
      linear-gradient(180deg, #1a2e32 0%, #4a8a8a 28%, #c45a2a 62%, #3a1c38 100%);
    animation: drift 22s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0% { filter: hue-rotate(0deg) brightness(1); }
    100% { filter: hue-rotate(-6deg) brightness(1.04); }
  }
  /* film grain */
  #grain {
    position: absolute; inset: -50%;
    width: 200%; height: 200%;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.35'/></svg>");
    opacity: 0.18;
    mix-blend-mode: overlay;
    animation: grainshift 0.6s steps(4) infinite;
    pointer-events: none;
  }
  @keyframes grainshift {
    0% { transform: translate(0,0); }
    100% { transform: translate(-4%,3%); }
  }
  #vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(4,4,8,0.75) 100%);
    pointer-events: none;
  }
  #wordmark {
    position: relative; z-index: 2;
    font-size: 15vh; font-weight: 700; letter-spacing: 0.04em;
    color: #ffd24a;
    text-shadow: 0 0 40px rgba(255,210,74,0.55), 0 4px 0 rgba(0,0,0,0.4);
    line-height: 1;
  }
  #sub {
    position: relative; z-index: 2;
    margin-top: 0.6rem;
    font-size: 1.1rem; letter-spacing: 0.32em; text-transform: uppercase;
    color: rgba(255,255,255,0.82);
  }
  #barwrap {
    position: relative; z-index: 2;
    margin-top: 4.5rem;
    width: min(52vw, 460px);
    height: 6px;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 3px;
    overflow: hidden;
  }
  #bar {
    height: 100%;
    width: 18%;
    background: linear-gradient(90deg, #ffd24a, #ff9d4a);
    box-shadow: 0 0 16px rgba(255,180,60,0.7);
    animation: sweep 1.7s ease-in-out infinite;
  }
  @keyframes sweep {
    0% { transform: translateX(-100%); width: 30%; }
    50% { width: 55%; }
    100% { transform: translateX(220%); width: 30%; }
  }
  #tip {
    position: relative; z-index: 2;
    margin-top: 1.1rem;
    max-width: 60vw;
    min-height: 1.4em;
    font-size: 0.95rem;
    color: rgba(255,255,255,0.68);
    text-align: center;
    letter-spacing: 0.01em;
  }
  #corner {
    position: absolute; z-index: 2; bottom: 22px; right: 28px;
    font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(255,255,255,0.4);
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="grain"></div>
    <div id="vignette"></div>
    <div id="wordmark">$DDD</div>
    <div id="sub" id="target-sub">MAPLE CITY</div>
    <div id="barwrap"><div id="bar"></div></div>
    <div id="tip" id="tip"></div>
    <div id="corner">DROOLY GAMES</div>
  </div>
  <script>
    const TIPS = [
      "Loot the streets — every ★ ticket brings you closer to the golden ten.",
      "Three trials decide your fate: Code, Canvas, Heart.",
      "The moshpit is one cloud — web, desktop, and Seeker share the same room.",
      "Melt fast, climb faster. Score keeps counting after you go down.",
      "ICEFAM FM never stops — toggle the radio dock any time.",
      "Golden Drool Tickets are real. May the odds be ever in your flavor.",
      "D-Roc spits it, Ari builds it — Maple City runs on both.",
      "Press Space to drop in. There's no menu between you and the arena.",
    ];
    const tipEl = document.getElementById("tip");
    const subEl = document.getElementById("target-sub");
    let i = Math.floor(Math.random() * TIPS.length);
    function paintTip() {
      tipEl.style.opacity = 0;
      setTimeout(() => {
        tipEl.textContent = TIPS[i % TIPS.length];
        tipEl.style.transition = "opacity .35s ease";
        tipEl.style.opacity = 1;
        i++;
      }, 180);
    }
    paintTip();
    setInterval(paintTip, 2600);

    // main.js sets window.__DROOLY_BOOT_SUB__ via executeJavaScript before show.
    if (window.__DROOLY_BOOT_SUB__) subEl.textContent = window.__DROOLY_BOOT_SUB__;
  </script>
</body>
</html>
